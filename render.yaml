services:
  - type: web
    name: petshop-prado
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_MODE
        value: atlas
      - key: MONGO_DB_NAME
        value: petshop_prado
      - key: MONGO_ATLAS_URI
        sync: false
      - key: PORT
        value: 8000
